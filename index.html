<meta name="theme-color" content="#0f766e">
<style>
  :root{
    --bg:#f5f7f6; --card:#ffffff; --text:#1c2321; --muted:#5b6662;
    --accent:#0f766e; --accent-soft:#d9f0ec; --bad:#b91c1c;
    --border:#e2e8e5; --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1413; --card:#18201e; --text:#e8eeec; --muted:#9aa8a3;
      --accent:#2dd4bf; --accent-soft:#123a35; --bad:#f87171; --border:#26302d;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
  header{position:sticky;top:0;z-index:5;background:#0f766e;color:#fff;
         padding:12px 16px;display:flex;align-items:center;gap:10px}
  header h1{font-size:1.05rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header button{background:rgba(255,255,255,.18);border:0;color:#fff;
                padding:6px 12px;border-radius:999px;font-size:.9rem;cursor:pointer;white-space:nowrap}
  main{max-width:720px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
        padding:16px;margin-bottom:12px}
  .module{display:flex;align-items:center;gap:14px;cursor:pointer}
  .module .icon{font-size:1.7rem;width:48px;height:48px;display:grid;place-items:center;
                background:var(--accent-soft);border-radius:12px;flex-shrink:0}
  .module h3{margin:0 0 2px;font-size:1rem}
  .module p{margin:0;color:var(--muted);font-size:.88rem}
  .section{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 4px 8px}
  h2{font-size:1.3rem;margin:4px 0 12px}
  .lesson h4{margin:18px 0 6px;color:var(--accent)}
  .lesson p,.lesson li{font-size:.97rem}
  .tip{background:var(--accent-soft);border-left:4px solid var(--accent);
       padding:10px 12px;border-radius:8px;margin:12px 0;font-size:.93rem}
  .warn{background:rgba(185,28,28,.08);border-left:4px solid var(--bad);
        padding:10px 12px;border-radius:8px;margin:12px 0;font-size:.93rem}
  table{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0}
  td,th{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left}
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .choice.three{grid-template-columns:1fr 1fr 1fr}
  .choice button{padding:14px 8px;border-radius:12px;border:2px solid var(--border);
                 background:var(--card);color:var(--text);cursor:pointer;font-size:.95rem}
  .choice button .big{display:block;font-size:1.8rem;margin-bottom:4px}
  .choice button.active{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
  .btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;
       background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;margin-top:16px}
  @media (prefers-color-scheme: dark){ .btn{color:#0f1413} }
  label{display:block;font-size:.9rem;margin:12px 0 4px;color:var(--muted)}
  input{width:100%;padding:11px;border:2px solid var(--border);border-radius:10px;
        font-size:1rem;background:var(--card);color:var(--text)}
  .result{font-size:1.05rem;margin-top:14px}
  .result b{color:var(--accent)}
  .note{color:var(--muted);font-size:.85rem}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;padding:10px 6px;border-radius:10px;border:2px solid var(--border);
               background:var(--card);color:var(--text);cursor:pointer;font-size:.88rem}
  .tabs button.active{border-color:var(--accent);color:var(--accent);font-weight:600}
  .gl dt{font-weight:600;margin-top:12px}
  .gl dd{margin:2px 0 0;color:var(--muted);font-size:.93rem}
  .src{padding-left:18px;font-size:.88rem}
  .src li{margin:6px 0}
  .src a{color:var(--accent);word-break:break-word}
  footer{color:var(--muted);font-size:.78rem;text-align:center;padding:20px 16px 40px}
</style>
</head>

{ id:'basicos', icon:'🧱', title:'O básico', sub:'Juros compostos, risco e por onde começar', body:`
<h4>Antes de investir</h4>
<ul>
<li><b>Fundo de emergência</b> — 3 a 6 meses de despesas numa conta poupança, acessível a qualquer momento.</li>
<li><b>Sem dívidas caras</b> — cartão de crédito ou crédito pessoal a 10–20% custam mais do que o mercado costuma render.</li>

<h4>Juros compostos</h4>
<p>Os ganhos geram novos ganhos. €200/mês durante 30 anos a 7% ao ano dão cerca de <b>€240.000</b>, dos quais só €72.000 saíram do teu bolso. Começar cedo vale mais do que começar com muito.</p>
<h4>Risco e retorno</h4>
<p>Mais retorno esperado vem sempre com mais oscilação. Ações podem cair 30–50% num ano mau. Historicamente o mercado recupera, mas isso não é garantido.</p>

{ id:'etf', icon:'📊', title:'ETFs', sub:'O que são e como escolher', body:`
<h4>O que é um ETF?</h4>
<p>Um <b>Exchange Traded Fund</b> é um cesto de ações (ou obrigações) que se compra na bolsa como uma única ação. Um ETF do índice mundial dá-te pequenas partes de milhares de empresas.</p>

<h4>Acumulação vs Distribuição</h4>
<ul>
<li><b>Acumulação (Acc)</b> — os dividendos são reinvestidos automaticamente. Sem imposto enquanto não vendes.</li>

{ id:'ie-etf', icon:'🧾', title:'Impostos nos ETFs', sub:'Exit tax 38% e a regra dos 8 anos', body:`
<h4>Exit Tax: 38%</h4>
<p>Na Irlanda, os ganhos em ETFs europeus não pagam CGT — pagam <b>Exit Tax</b>, que desceu de 41% para <b>38%</b> a 1 de janeiro de 2026. Os dividendos de ETFs de distribuição também pagam 38%.</p>
<h4>Deemed Disposal (regra dos 8 anos)</h4>
<p>A cada 8 anos depois de cada compra, a Revenue <b>considera que vendeste</b> e pagas 38% sobre o ganho — mesmo sem venderes.</p>
<p><b>Exemplo:</b> investes €10.000 em 2026. Em 2034 vale €18.000. Pagas 38% × €8.000 = <b>€3.040</b> e continuas com o ETF. Na venda final esse valor é descontado.</p>
<div class="warn">⚠️ Cada compra tem a sua própria data de 8 anos. Quem investe todos os meses tem de controlar cada lote. Guarda todos os extratos.</div>
<div class="tip">🇮🇪 vs 🇵🇹 Em Portugal não existe esta regra: só se paga quando se vende, e quem mantém 8 anos ou mais tem até 30% do ganho excluído de imposto.</div>
<h4>Perdas não compensam</h4>
<p>Perdas num ETF <b>não</b> podem ser abatidas a ganhos noutro ETF, nem a ganhos em ações.</p>
<h4>Como declarar</h4>
<p>No <b>Form 11</b>, normalmente até 31 de outubro do ano seguinte — mesmo que só tenhas rendimentos PAYE.</p>
<h4>Nova Conta de Investimento</h4>
<p>Está prevista para 2027 uma conta pessoal (estilo ISA britânico) para residentes com 18+ anos e PPSN, uma por pessoa. Dentro dela <b>não há deemed disposal</b>: há um limite isento e uma taxa anual baixa acima dele, calculada pelo banco/corretora. Confirma os valores definidos no Orçamento 2027.</p>`},
{ id:'ie-acoes', icon:'📈', title:'Ações individuais', sub:'CGT, dividendos e perdas', body:`
<h4>Capital Gains Tax (CGT): 33%</h4>
<p>Ganhos com a venda de ações individuais (e de ETFs dos EUA) pagam <b>CGT a 33%</b>.</p>
<h4>Isenção anual: €1.270</h4>
<p>Os primeiros <b>€1.270</b> de ganhos por ano, por pessoa, estão isentos. Não acumula de ano para ano.</p>
<h4>Perdas compensam</h4>

<h4>Dividendos</h4>

{ id:'ie-prsa', icon:'🏖️', title:'PRSA e reforma', sub:'Investir com benefício fiscal', body:`
<h4>O que é um PRSA?</h4>
<p><b>Personal Retirement Savings Account</b> — conta individual de reforma. É tua, segue-te se mudares de emprego e investe normalmente em fundos.</p>
<h4>Alívio fiscal à entrada</h4>
<p>O que contribuis sai do rendimento antes de imposto. Na taxa de 40%, cada <b>€100</b> custa-te <b>€60</b>. Na de 20%, custa €80.</p>
<h4>Limites por idade (% do salário bruto)</h4>
<table><tr><th>Idade</th><th>Limite</th></tr>
<tr><td>Até 29</td><td>15%</td></tr><tr><td>30–39</td><td>20%</td></tr><tr><td>40–49</td><td>25%</td></tr>

<p>Salário considerado até <b>€115.000</b>.</p>
<h4>Dentro do PRSA</h4>
<p>Os ganhos crescem <b>sem imposto</b> — sem Exit Tax, sem deemed disposal, sem CGT.</p>
<h4>Na reforma</h4>
<ul>
<li>Acesso normalmente entre os <b>60 e os 75 anos</b>.</li>
<li>Até <b>25%</b> de uma vez; os primeiros <b>€200.000</b> desse montante são isentos.</li>

</ul>
<div class="warn">⚠️ O dinheiro fica preso até à reforma.</div>

{ id:'pt-mv', icon:'🧾', title:'Mais-valias', sub:'28%, englobamento e a regra do tempo', body:`
<h4>Taxa de 28%</h4>
<p>Ganhos na venda de ações e ETFs pagam <b>28%</b> (taxa autónoma) sobre o saldo do ano: soma de ganhos menos perdas.</p>
<h4>Não há regra dos 8 anos</h4>
<p>Ao contrário da Irlanda, em Portugal <b>só pagas quando vendes</b>. Com ETFs de acumulação, podes manter o investimento décadas sem pagar nada pelo caminho.</p>
<h4>Bónus por manter mais tempo</h4>
<p>Para ações cotadas e ETFs, parte do ganho fica excluída de imposto conforme o tempo que os detiveste:</p>
<table><tr><th>Tempo</th><th>Parte excluída</th></tr>
<tr><td>Menos de 2 anos</td><td>0%</td></tr><tr><td>2 a 5 anos</td><td>10%</td></tr>
<tr><td>5 a 8 anos</td><td>20%</td></tr><tr><td>8 anos ou mais</td><td>30%</td></tr></table>
<p><b>Exemplo:</b> ganho de €5.000 num ETF detido 6 anos → só €4.000 tributáveis → €1.120 de imposto em vez de €1.400.</p>
<div class="tip">🇵🇹 vs 🇮🇪 Um contraste curioso: na Irlanda, manter um ETF 8 anos <b>obriga</b> a pagar imposto (deemed disposal). Em Portugal, manter 8 anos dá <b>desconto</b> de 30% no ganho tributável.</div>
<h4>Englobamento</h4>
<p>Podes optar por somar os ganhos aos outros rendimentos e pagar à taxa do teu escalão. Só compensa se a tua taxa marginal for <b>inferior a 28%</b>. Se optares, todas as mais-valias do ano entram.</p>
<div class="warn">⚠️ Englobamento <b>obrigatório</b>: ganhos de ativos detidos <b>menos de 365 dias</b>, quando o rendimento total chega ao último escalão do IRS (cerca de €86.600 em 2026).</div>
<h4>Perdas</h4>
<p>Compensam ganhos do mesmo ano. Só passam para os 5 anos seguintes se optares pelo englobamento.</p>
<h4>Como declarar</h4>
<ul>
<li>IRS entre <b>1 de abril e 30 de junho</b> do ano seguinte.</li>
<li>Corretora portuguesa → <b>Anexo G</b>. Corretora estrangeira (DEGIRO, IBKR, Trading 212…) → <b>Anexo J</b>.</li>
<li>Contas em corretoras estrangeiras também têm de ser indicadas no Anexo J.</li>
<li>Regra <b>FIFO</b>: vendem-se primeiro as unidades compradas há mais tempo.</li>
</ul>`},
{ id:'pt-div', icon:'💸', title:'Dividendos e juros', sub:'Retenção a 28% e dupla tributação', body:`
<h4>Dividendos: 28%</h4>
<p>Dividendos e juros pagam <b>28%</b>. Em bancos e corretoras portuguesas o imposto é retido na fonte e não tens de fazer mais nada (a não ser que queiras englobar).</p>
<h4>Dividendos estrangeiros</h4>
<p>O país da empresa retém primeiro a sua parte. Portugal cobra a diferença até aos 28%.</p>
<p><b>Exemplo EUA:</b> com o formulário <b>W-8BEN</b> os EUA retêm 15%; Portugal cobra os restantes 13%. Sem W-8BEN retêm 30% — e recuperar o excesso é difícil.</p>
<h4>Juros de depósitos e Certificados</h4>
<p>Também 28%, retidos na fonte automaticamente.</p>
<div class="tip">💡 Com ETFs de acumulação não recebes dividendos, logo não há imposto anual. O imposto fica todo para a venda — e beneficia da exclusão por tempo de detenção.</div>`},
{ id:'pt-ppr', icon:'🏖️', title:'PPR', sub:'Plano Poupança Reforma', body:`
<h4>O que é um PPR?</h4>
<p>Um produto de poupança para a reforma. Pode ser um fundo (com ações e obrigações) ou um seguro. Escolhe pelo tipo de investimento e pelas comissões.</p>
<h4>Dedução no IRS</h4>
<p>Abates <b>20%</b> do que entregas diretamente ao imposto, até um máximo por idade:</p>
<table><tr><th>Idade</th><th>Dedução máx.</th><th>Entrega para a esgotar</th></tr>
<tr><td>Menos de 35</td><td>€400</td><td>€2.000</td></tr>
<tr><td>35 a 50</td><td>€350</td><td>€1.750</td></tr>
<tr><td>Mais de 50</td><td>€300</td><td>€1.500</td></tr></table>
<p>A dedução vale o mesmo em qualquer escalão, mas entra no limite global de deduções do agregado.</p>

<p>Gains on selling shares and ETFs ("mais-valias") pay a flat <b>28%</b> on the year's net result: gains minus losses.</p>
<h4>No 8-year rule</h4>
<p>Unlike Ireland, in Portugal <b>you only pay when you sell</b>. With accumulating ETFs you can hold for decades without paying anything along the way.</p>
<h4>Holding-period bonus</h4>
<p>For listed shares and ETFs, part of the gain is excluded from tax depending on how long you held:</p>
<table><tr><th>Held</th><th>Excluded</th></tr>
<tr><td>Under 2 years</td><td>0%</td></tr><tr><td>2 to 5 years</td><td>10%</td></tr>
<tr><td>5 to 8 years</td><td>20%</td></tr><tr><td>8 years or more</td><td>30%</td></tr></table>
<p><b>Example:</b> €5,000 gain on an ETF held 6 years → only €4,000 taxable → €1,120 tax instead of €1,400.</p>
<div class="tip">🇵🇹 vs 🇮🇪 A striking contrast: in Ireland, holding an ETF for 8 years <b>triggers</b> tax (deemed disposal). In Portugal, holding 8 years gives a <b>30% discount</b> on the taxable gain.</div>
<h4>Englobamento</h4>
<p>You can choose to add gains to your other income and pay at your bracket rate. Only worth it if your marginal rate is <b>below 28%</b>. If you opt in, all gains for the year are included.</p>
<div class="warn">⚠️ <b>Mandatory</b> englobamento: gains on assets held <b>under 365 days</b>, when total income reaches the top IRS bracket (about €86,600 in 2026).</div>
<h4>Losses</h4>
<p>Offset gains in the same year. They only carry forward (5 years) if you opt for englobamento.</p>
<h4>How to file</h4>
<ul>
<li>IRS return between <b>1 April and 30 June</b> the following year.</li>
<li>Portuguese broker → <b>Anexo G</b>. Foreign broker (DEGIRO, IBKR, Trading 212…) → <b>Anexo J</b>.</li>
<li>Accounts at foreign brokers must also be listed on Anexo J.</li>
<li><b>FIFO</b> rule: the oldest units are treated as sold first.</li>
</ul>`},
{ id:'pt-div', icon:'💸', title:'Dividends & interest', sub:'28% withholding and double taxation', body:`
<h4>Dividends: 28%</h4>
<p>Dividends and interest pay <b>28%</b>. At Portuguese banks and brokers it is withheld at source and you don't need to do anything else (unless you choose englobamento).</p>
<h4>Foreign dividends</h4>
<p>The company's country withholds its share first. Portugal charges the difference up to 28%.</p>
<p><b>US example:</b> with the <b>W-8BEN</b> form the US withholds 15%; Portugal charges the remaining 13%. Without it the US withholds 30% — and reclaiming the excess is hard.</p>
<h4>Deposit interest and Certificados</h4>
<p>Also 28%, withheld automatically.</p>
<div class="tip">💡 Accumulating ETFs pay you no dividends, so there is no yearly tax. All the tax is deferred to the sale — and benefits from the holding-period exclusion.</div>`},
{ id:'pt-ppr', icon:'🏖️', title:'PPR', sub:'Portuguese retirement savings plan', body:`
<h4>What is a PPR?</h4>
<p>A <b>Plano Poupança Reforma</b> is a retirement savings product. It can be a fund (shares and bonds) or an insurance product. Choose by what it invests in and by its fees.</p>
<h4>IRS deduction</h4>
<p>You deduct <b>20%</b> of what you pay in straight off your tax bill, up to an age-based cap:</p>
<table><tr><th>Age</th><th>Max deduction</th><th>Contribution to max it</th></tr>
<tr><td>Under 35</td><td>€400</td><td>€2,000</td></tr>
<tr><td>35 to 50</td><td>€350</td><td>€1,750</td></tr>
<tr><td>Over 50</td><td>€300</td><td>€1,500</td></tr></table>
<p>It is worth the same in every bracket, but counts toward the household overall deduction cap.</p>
<h4>Penalty-free withdrawal</h4>
<p>From age 60 or at retirement, and in cases like long-term unemployment, serious illness or disability — with contributions generally at least 5 years old. Gains are then taxed at about <b>8%</b>.</p>
<div class="warn">⚠️ Withdrawing outside these conditions: you repay the deductions you received, plus <b>10% for each year</b> since, and gains are taxed more heavily.</div>
<div class="tip">💡 For long horizons, a low-fee equity PPR combines the tax deduction with market growth.</div>`},
],
glossary:[
['ETF','Exchange-traded fund that tracks an index or basket of assets.'],
['UCITS','EU rules for funds sold to retail investors.'],
['ISIN','12-character code identifying an investment.'],
['TER','The fund\u2019s annual cost, as a % of the amount invested.'],
['Acc / Dist','Accumulating (reinvests dividends) or Distributing (pays them out).'],
['W-8BEN','US form that cuts withholding on dividends to 15%.'],
['FIFO','First In, First Out: oldest units are treated as sold first.'],
['Broker','Platform where you buy shares and ETFs.'],
],
glIE:[
['Exit Tax','38% tax on gains from funds/ETFs in Ireland.'],
['Deemed Disposal','Notional sale every 8 years, with Exit Tax on the gain.'],
['CGT','Capital Gains Tax: 33% on share gains.'],
['Form 11','Tax return for anyone with non-PAYE income.'],
['PRSA','Personal pension account with tax relief.'],
['ARF','Fund where your pension stays invested after retirement.'],
],
glPT:[
['Mais-valia','Capital gain on selling an asset. IRS category G.'],
['Taxa autónoma','Flat 28% rate, kept separate from other income.'],
['Englobamento','Adding gains to other income and paying at your bracket rate.'],
['Anexo J','IRS annex for foreign income and accounts.'],
['Anexo G','IRS annex for capital gains.'],
['PPR','Portuguese retirement savings plan with an IRS deduction.'],
]
};

const CONTENT = { 'pt-PT':PT_PT, 'pt-BR':PT_BR, 'en':EN };

/* =====================================================================
   FONTES / SOURCES
   ===================================================================== */
const SRC = {
  etfgl:   ['etf.ie – Irish ETF Glossary','https://etf.ie/glossary/'],
  etfb26:  ['etf.ie – Budget 2026: ETF tax changes (38%)','https://etf.ie/blog/budget-2026-etf/'],
  itdd:    ['Irish Times – ETF investors face another wait for deemed-disposal reform (set. 2026)','https://www.irishtimes.com/your-money/2026/09/06/irelands-etf-investors-face-another-wait-for-deemed-disposal-reform/'],
  lsacct:  ['Law Society Gazette – Finance Bill to set out investment-account details (ago. 2026)','https://www.lawsociety.ie/gazette/top-stories/2026/august/finance-bill-to-set-out-investment-account-details/'],
  lscgt:   ['Law Society of Ireland – Tax guide: Capital Gains Tax','https://www.lawsociety.ie/Solicitors/knowledge-base/practice-areas/Taxation/tax-guide/capital-gains-tax/'],
  revprsa: ['Revenue – Tax relief on pension contributions (limits)','https://revenue.ie/en/jobs-and-pensions/pension/relief/tax-relief-limits.aspx'],
  pf43:    ['Portal das Finanças – Artigo 43.º do CIRS (mais-valias)','https://info.portaldasfinancas.gov.pt/pt/informacao_fiscal/codigos_tributarios/cirs_rep/Pages/irs43.aspx'],
  simula:  ['simula.pt – Simulador de mais-valias de ações e ETF 2026','https://simula.pt/simuladores/simulador_mais_valias_acoes'],
  crn:     ['CRN Contabilidade – Mais-valias de ações e ETF no IRS 2026 (Anexo J)','https://crncontabilidade.pt/blog/mais-valias-de-acoes-e-etf-no-irs-2026-como-declarar-no-anexo-j/'],
  sabado:  ['Sábado – Tributação de mais-valias e dividendos em Portugal (abr. 2026)','https://www.sabado.pt/c-studio/detalhe/20260401-110822-como-funciona-a-tributacao-de-mais-valias-e-dividendos-em-portugal'],
  dfppr:   ['Doutor Finanças – PPR e benefícios fiscais','https://www.doutorfinancas.pt/investimentos/ppr-e-beneficios-fiscais-como-poupar-no-irs-enquanto-prepara-a-reforma/'],
  decoppr: ['DECO Proteste – Como aproveitar o benefício fiscal do PPR','https://www.deco.proteste.pt/investe/reforma/fundos-ppr/dossies/tudo-sobre-ppr/como-aproveitar-beneficio-fiscal-ppr'],
};
const MOD_SRC = {
  'etf':     ['etfgl'],
  'ie-etf':  ['etfb26','etfgl','itdd','lsacct','pf43'],
  'ie-acoes':['lscgt','etfgl'],
  'ie-prsa': ['revprsa'],
  'pt-mv':   ['pf43','simula','crn','etfgl'],
  'pt-div':  ['sabado','simula'],
  'pt-ppr':  ['dfppr','decoppr'],
};
const COUNTRY_SRC = { ie:['etfb26','etfgl','itdd','lsacct','lscgt','revprsa'],
                      pt:['pf43','simula','crn','sabado','dfppr','decoppr'] };
const srcList = keys => `<ul class="src">${keys.map(k =>
  `<li><a href="${SRC[k][1]}" target="_blank" rel="noopener">${SRC[k][0]}</a></li>`).join('')}</ul>`;

/* =====================================================================
   ESTADO
   ===================================================================== */
let cfg = null;
try { cfg = JSON.parse(localStorage.getItem('cfg')); } catch(e) {}
function saveCfg(){ try { localStorage.setItem('cfg', JSON.stringify(cfg)); } catch(e) {} }

const app = document.getElementById('app');
const titleEl = document.getElementById('title');
const backBtn = document.getElementById('backBtn');
const setBtn = document.getElementById('setBtn');
const FLAG = { ie:'🇮🇪', pt:'🇵🇹' };
const LANGS = [['pt-PT','🇵🇹','Português (PT)'],['pt-BR','🇧🇷','Português (BR)'],['en','🇬🇧','English']];

const T = () => UI[cfg.lang];
const C = () => CONTENT[cfg.lang];

function chrome(title, showBack){
  titleEl.textContent = title;
  backBtn.style.display = showBack ? 'block' : 'none';
  backBtn.textContent = T().back;
  setBtn.textContent = FLAG[cfg.country] + ' ⚙️';
  document.getElementById('foot').textContent = T().foot;
  document.documentElement.lang = cfg.lang;
  window.scrollTo(0,0);
}

/* =====================================================================
   VISTAS
   ===================================================================== */
function card(m, onclick){
  return `<div class="card module" onclick="${onclick}">
    <div class="icon">${m.icon}</div><div><h3>${m.title}</h3><p>${m.sub}</p></div></div>`;
}

function goHome(){
  const t = T(), c = C();
  chrome('💶 ' + t.appTitle, false);
  app.innerHTML = `
    <div class="section">${t.common}</div>
    ${c.common.map(m => card(m, `openModule('${m.id}')`)).join('')}
    <div class="section">${FLAG[cfg.country]} ${t.country[cfg.country]}</div>
    ${c[cfg.country].map(m => card(m, `openModule('${m.id}')`)).join('')}
    <div class="section">🛠️</div>
    ${card({icon:'🧮', title:t.calcTitle, sub:t.calcSub}, 'openCalc()')}
    ${card({icon:'📖', title:t.glTitle, sub:t.glSub}, 'openGlossary()')}
    ${card({icon:'📚', title:t.srcTitle, sub:t.srcSub}, 'openSources()')}`;
}

function openSources(){
  const t = T();
  chrome('📚 ' + t.srcTitle, true);
  app.innerHTML = `<div class="card"><h2>${FLAG[cfg.country]} ${t.country[cfg.country]}</h2>
    ${srcList(COUNTRY_SRC[cfg.country])}</div>`;
}

function openModule(id){
  const c = C();
  const m = [...c.common, ...c.ie, ...c.pt].find(x => x.id === id);
  chrome(m.icon + ' ' + m.title, true);
  const keys = MOD_SRC[m.id];
  app.innerHTML = `<div class="card lesson"><h2>${m.title}</h2>${m.body}
    ${keys ? `<h4>📚 ${T().srcTitle}</h4>${srcList(keys)}` : ''}</div>`;
}

function openGlossary(){
  const t = T(), c = C();
  const list = [...c.glossary, ...(cfg.country === 'ie' ? c.glIE : c.glPT)]
    .sort((a,b) => a[0].localeCompare(b[0]));
  chrome('📖 ' + t.glTitle, true);
  app.innerHTML = `<div class="card"><dl class="gl">
    ${list.map(([k,d]) => `<dt>${k}</dt><dd>${d}</dd>`).join('')}</dl></div>`;
}

/* ---------- definições ---------- */
let draft = null;
function openSettings(first){
  draft = cfg ? {...cfg} : { lang:'pt-PT', country:'ie' };
  renderSettings(first);
}
function renderSettings(first){
  const t = UI[draft.lang];
  titleEl.textContent = '⚙️ ' + t.settings;
  backBtn.style.display = first ? 'none' : 'block';
  backBtn.textContent = t.back;
  setBtn.style.display = 'none';
  app.innerHTML = `
    ${first ? `<div class="card">${t.welcome}</div>` : ''}
    <div class="section">${t.lang}</div>
    <div class="choice three">${LANGS.map(([code,flag,name]) =>
      `<button class="${draft.lang===code?'active':''}" onclick="draft.lang='${code}';renderSettings(${!!first})">
       <span class="big">${flag}</span>${name}</button>`).join('')}</div>
    <div class="section">${t.where}</div>
    <div class="choice">${['pt','ie'].map(k =>
      `<button class="${draft.country===k?'active':''}" onclick="draft.country='${k}';renderSettings(${!!first})">
       <span class="big">${FLAG[k]}</span>${t.country[k]}</button>`).join('')}</div>
    <button class="btn" onclick="applySettings()">${first ? t.start : t.save}</button>`;
}
function applySettings(){
  cfg = draft; saveCfg();
  setBtn.style.display = 'block';
  goHome();
}

/* =====================================================================
   CALCULADORAS
   ===================================================================== */
const fmt = n => '€' + Math.round(n).toLocaleString(cfg.lang === 'en' ? 'en-IE' : cfg.lang);
const num = id => parseFloat(document.getElementById(id).value) || 0;
const field = (id,label,val,step) => `<label>${label}</label><input id="${id}" type="number" inputmode="decimal" value="${val}" step="${step||'any'}">`;

function openCalc(tab){
  const t = T();
  const tabs = cfg.country === 'ie'
    ? [['juros',t.tCompound],['dd',t.tDD],['prsa',t.tPRSA]]
    : [['juros',t.tCompound],['mv',t.tMV],['ppr',t.tPPR]];
  tab = tab || 'juros';
  chrome('🧮 ' + t.calcTitle, true);
  const forms = {
    juros: field('a',t.initial,1000) + field('b',t.monthly,200) + field('c',t.ret,7) + field('d',t.years,20),
    dd:    field('a',t.amount,10000) + field('b',t.ret,7),
    prsa:  field('a',t.age,35) + field('b',t.salary,50000) + field('c',t.marg,40),
    mv:    field('a',t.buy,10000) + field('b',t.sell,15000) + field('c',t.held,6),
    ppr:   field('a',t.age,30) + field('b',t.yearly,2000),
  };
  app.innerHTML = `<div class="tabs">${tabs.map(([id,l]) =>
      `<button class="${tab===id?'active':''}" onclick="openCalc('${id}')">${l}</button>`).join('')}</div>
    <div class="card">${forms[tab]}<div class="result" id="res"></div></div>`;
  app.querySelectorAll('input').forEach(i => i.addEventListener('input', () => calc(tab)));
  calc(tab);
}

function calc(tab){
  const t = T(), res = document.getElementById('res');
  if (tab === 'juros'){
    const P = num('a'), M = num('b'), r = num('c')/100/12, n = Math.round(num('d')*12);
    let total = P; for (let k=0;k<n;k++) total = total*(1+r) + M;
    const put = P + M*n;
    res.innerHTML = `${t.final}: <b>${fmt(total)}</b><br>${t.invested}: ${fmt(put)}<br>${t.gain}: ${fmt(total-put)}
      <p class="note">${t.beforeTax}</p>`;
  }
  if (tab === 'dd'){
    const P = num('a'), val = P*Math.pow(1+num('b')/100, 8), gain = Math.max(0, val-P);
    res.innerHTML = `${t.after8}: <b>${fmt(val)}</b><br>${t.gain}: ${fmt(gain)}<br>${t.taxDue}: <b>${fmt(gain*0.38)}</b>
      <p class="note">${t.ddNote}</p>`;
  }
  if (tab === 'prsa'){
    const age = num('a'), sal = Math.min(num('b'), 115000), rate = num('c') >= 40 ? 0.4 : 0.2;
    const pct = age<30?.15 : age<40?.20 : age<50?.25 : age<55?.30 : age<60?.35 : .40;
    const max = sal*pct;
    res.innerHTML = `${t.prsaMax}: <b>${fmt(max)}${t.perYear}</b> (${Math.round(pct*100)}% ${t.ofSalary})<br>
      ${t.relief}: ${fmt(max*rate)}<br>${t.realCost}: <b>${fmt(max*(1-rate))}</b><p class="note">${t.prsaNote}</p>`;
  }
  if (tab === 'mv'){
    const gain = num('b') - num('a'), yrs = num('c');
    const ex = yrs>=8 ? .30 : yrs>=5 ? .20 : yrs>2 ? .10 : 0;
    const taxable = Math.max(0, gain*(1-ex));
    res.innerHTML = `${t.gain}: ${fmt(gain)}<br>${t.excl}: ${Math.round(ex*100)}%<br>
      ${t.taxable}: ${fmt(taxable)}<br>${t.tax28}: <b>${fmt(taxable*0.28)}</b><p class="note">${t.mvNote}</p>`;
  }
  if (tab === 'ppr'){
    const age = num('a'), put = num('b');
    const cap = age<35 ? 400 : age<=50 ? 350 : 300;
    const ded = Math.min(put*0.2, cap);
    res.innerHTML = `${t.deduction}: <b>${fmt(ded)}</b> (max ${fmt(cap)})<br>
      ${put*0.2 < cap ? `${t.toMax} ${fmt(cap/0.2)}` : ''}<p class="note">${t.pprNote}</p>`;
  }
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
if (cfg && UI[cfg.lang] && cfg.country) goHome();
else openSettings(true);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
